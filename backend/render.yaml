services:
  - type: web
    name: ai-job-chat-assistant-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: TAVILY_API_KEY
        sync: false
      - key: STORAGE_DIR
        value: /data
      - key: AGENT_ALLOW_AUTOMATION
        value: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
